
name: KALQO Samsung APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: unzip -oq KALQO_Phone_Source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter create --platforms=android --org com.axreon --project-name kalqo .

      - run: python3 tool/prepare_android.py

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: KALQO-Samsung-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
